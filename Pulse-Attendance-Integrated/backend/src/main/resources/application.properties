# Common application configuration
spring.application.name=Pulse Attendance Backend
server.port=8080

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=INFO
logging.level.com.pulse.attendance=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %level - %logger{36} - %msg%n

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

spring.profiles.active=dev

# JWT configuration - override app.jwt.secret in production with a strong secret
app.jwt.secret=${JWT_SECRET:PulseAttendanceJwtSecretKeyChangeThisInProduction2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
